name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Offline tests (no provider credentials or calls)
        env:
          JEV_TOKEN: ""
          EMISSARY_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pytest
      - name: Build and check distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m twine check --strict dist/*
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import decisionlane, decisionlane.backends; print(decisionlane.__file__)"
